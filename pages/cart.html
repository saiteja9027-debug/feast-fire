
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart | Feast & Fire</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .cart-heading {
            background: #211b17;
            color: white;
            text-align: center;
            padding: 55px 20px;
        }

        .cart-heading h1 {
            color: #ffad33;
            font-size: 38px;
        }

        .cart-container {
            max-width: 900px;
            margin: 50px auto;
            padding: 20px;
        }

        .cart-item {
            background: white;
            padding: 22px;
            margin-bottom: 18px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            box-shadow: 0 4px 15px #0000000c;
        }

        .cart-item h3 {
            margin-bottom: 8px;
        }

        .cart-item p {
            color: #777;
            margin: 5px 0;
        }

        .cart-item button {
            background: #a52b20;
            color: white;
            padding: 9px 14px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .cart-summary {
            background: #211b17;
            color: white;
            padding: 28px;
            border-radius: 12px;
            margin-top: 25px;
        }

        .cart-summary h2 {
            color: #ffad33;
            margin-bottom: 15px;
        }

        .checkout-button {
            display: inline-block;
            background: #ffad33;
            color: #171717;
            padding: 13px 25px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            margin-top: 20px;
            cursor: pointer;
            text-decoration: none;
        }

        .empty-cart {
            text-align: center;
            padding: 50px;
            background: white;
            border-radius: 12px;
        }

        @media(max-width: 600px) {
            .cart-item {
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>

<header class="header">
    <a href="../index.html" class="logo">🔥 FEAST & FIRE</a>
    <nav class="navbar">
        <a href="../index.html">Home</a>
        <a href="menu.html">Menu</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
    </nav>
    <a href="cart.html" class="cart-button">
        🛒 Cart <span id="cart-count">0</span>
    </a>
</header>

<section class="cart-heading">
    <h1>Your Shopping Cart</h1>
    <p>Review your delicious selection.</p>
</section>

<main class="cart-container">
    <div id="cart-items"></div>

    <div class="cart-summary">
        <h2>Order Summary</h2>
        <h3 id="cart-total">Total: ₹0</h3>
        <a href="checkout.html" class="checkout-button">
            Proceed to Checkout →
        </a>
    </div>
</main>

<footer>
    <h2>🔥 FEAST & FIRE</h2>
    <p>Fresh Food. Bold Flavours. Happy Moments.</p>
    <p>© 2026 Feast & Fire. All rights reserved.</p>
</footer>

<script src="../js/script.js"></script>
</body>
</html>
